name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Запретить файлы больше 50 МБ и CSV
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          csv=$(git ls-files '*.csv')
          if [ -n "$big$csv" ]; then
            echo "Нельзя коммитить большие файлы и CSV:"; echo "$big"; echo "$csv"; exit 1
          fi

  postgresql-loader-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости загрузчика
        run: python -m pip install -r db/requirements.txt
      - name: Проверить синтаксис и имена таблиц
        run: |
          python -m compileall -q db
          python -m unittest discover -s db -p 'test_*.py'

  llm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend syntax and run LLM unit tests (without DB or Ollama)
        run: |
          python -m compileall -q backend
          python -m unittest discover -s backend/llm -p 'test_*.py' -t .

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build React application
        run: npm run build
