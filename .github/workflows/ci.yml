name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Запретить файлы больше 50 МБ и CSV
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          csv=$(git ls-files '*.csv')
          if [ -n "$big$csv" ]; then
            echo "Нельзя коммитить большие файлы и CSV:"; echo "$big"; echo "$csv"; exit 1
          fi
