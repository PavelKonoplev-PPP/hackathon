name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Запретить файлы больше 50 МБ и CSV
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          csv=$(git ls-files '*.csv')
          if [ -n "$big$csv" ]; then
            echo "Нельзя коммитить большие файлы и CSV:"; echo "$big"; echo "$csv"; exit 1
          fi

  postgresql-loader-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости загрузчика
        run: python -m pip install -r db/requirements.txt
      - name: Проверить синтаксис и имена таблиц
        run: |
          python -m compileall -q db
          python -m unittest discover -s db -p 'test_*.py'

  llm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend syntax and run LLM unit tests (without DB or Ollama)
        run: |
          python -m compileall -q backend
          python -m unittest discover -s backend/llm -p 'test_*.py' -t .
      - name: Verify backend regression tests for issues 97, 112-117, 122
        run: python -m unittest discover -s backend/tests -p 'test_*_unittest.py' -t . -v
      - name: Verify non-destructive local startup
        run: python -m unittest discover -s scripts -p 'test_*.py' -t . -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend regression tests
        run: npm test
      - name: Build React application
        run: npm run build

postgresql-date-audit-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bi_ci_tester
          POSTGRES_PASSWORD: ci_ephemeral_password_only
          POSTGRES_DB: bi_ci_date_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bi_ci_tester -d bi_ci_date_audit"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client dependencies
        run: python -m pip install -r db/requirements.txt
      - name: Audit actual PG16 date boundaries in an ephemeral CI DB only
        env:
          CI_DATE_AUDIT_DSN: postgresql://bi_ci_tester:ci_ephemeral_password_only@127.0.0.1:5432/bi_ci_date_audit
        run: python -m unittest db.test_date_ranges_pg_integration -v
