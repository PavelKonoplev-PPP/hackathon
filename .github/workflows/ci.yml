name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-large-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Запретить файлы больше 50 МБ и CSV
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +50M -print)
          csv=$(git ls-files '*.csv')
          if [ -n "$big$csv" ]; then
            echo "Нельзя коммитить большие файлы и CSV:"; echo "$big"; echo "$csv"; exit 1
          fi

  postgresql-loader-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: bi_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bi_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости загрузчика
        run: python -m pip install -r db/requirements.txt
      - name: Execute segment and outlier SQL against temporary PostgreSQL 16
        env:
          PG_SQL_SMOKE_DSN: postgresql://postgres:smoke@localhost:5432/bi_smoke
        run: python -m unittest discover -s db -p 'test_pg_segment_quality.py' -v
      - name: Проверить синтаксис и имена таблиц
        run: |
          python -m compileall -q db
          python -m unittest discover -s db -p 'test_*.py'
      - name: Execute normalized metric SQL against temporary PostgreSQL 16
        env:
          PG_SQL_SMOKE_DSN: postgresql://postgres:smoke@localhost:5432/bi_smoke
        run: python -m unittest discover -s db -p 'test_pg_normalized_metrics.py' -v

  llm-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend syntax and run LLM unit tests (without DB or Ollama)
        run: |
          python -m compileall -q backend
          python -m unittest discover -s backend/llm -p 'test_*.py' -t .

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build React application
        run: npm run build
